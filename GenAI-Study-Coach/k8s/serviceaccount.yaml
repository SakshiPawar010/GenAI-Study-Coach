# This Service Account is the bridge between the pod and the AWS IAM role
# The annotation below tells AWS: pods using this SA can assume the Bedrock IAM role
# The role ARN comes from: terraform output app_bedrock_role_arn
apiVersion: v1
kind: ServiceAccount
metadata:
  name: genai-study-coach-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: <REPLACE_WITH_TERRAFORM_OUTPUT_app_bedrock_role_arn>
