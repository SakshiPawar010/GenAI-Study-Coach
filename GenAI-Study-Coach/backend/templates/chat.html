<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat – GenAI Study Coach</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><a href="/" class="nav-back">← </a>💬 Chat with Your Notes</div>
        <div class="nav-right">
            <button id="darkModeBtn" class="btn-dark-toggle">🌙</button>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-header">
            <h1>💬 Chat with Your Notes</h1>
            <p>Ask any question about your uploaded study material</p>
        </div>

        <!-- Chat Window -->
        <div class="chat-window card">
            <div class="chat-history" id="chatHistory">
                <div class="chat-answer-bubble ai">
                    <strong>🤖 AI:</strong><br>Hi! Go back to the home page to upload your notes, then ask me anything about them.
                </div>
            </div>
            <div class="chat-input-bar">
                <input type="text" id="chatInput" placeholder="Ask a question about your notes..." />
                <button id="chatBtn" class="btn-chat">Send</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
